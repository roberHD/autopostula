<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>AutoPostula</title>
<style>
/* ── Reset & base ────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Misma paleta que la web: monocroma, con el citrón como único color.
     Fuera el morado — era la firma visual de página hecha con IA.
     --accent es el par de contraste del tema, no un tono. */
  --bg:        #F4F5F3;
  --surface:   #FFFFFF;
  --surface-2: #FAFAF9;
  --border:    #DFE1DE;
  --border-2:  #C6C9C5;

  --ink:       #16181A;
  --accent:    #16181A;
  --accent-h:  #000000;
  --accent-s:  #EDEEEB;

  --marker:    #D6F24B;
  --marker-d:  #A8C023;
  --on-marker: #16181A;

  --danger:    #B3283C;
  --danger-s:  #FAEAEC;
  --success:   #17784F;
  --success-s: #E4F1E9;
  --warn:      #8A5200;
  --warn-s:    #F7EFDF;

  --text-1:    #16181A;
  --text-2:    #3F4448;
  --text-3:    #5D6468;

  --radius:    9px;
  --shadow:    0 1px 0 var(--border), 0 10px 24px -18px rgba(22,24,26,.5);
}

html { font-size: 13px; }

/* Sin esto no se veía dónde estaba el foco al navegar con teclado. */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
body {
  width: 400px;
  max-height: 600px;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text-1);
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  line-height: 1.5;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
body::-webkit-scrollbar { width: 4px; }
body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Header ──────────────────────────────────────────────── */
/* La cabecera va sobre tinta: el popup se abre encima del portal, y así
   se lee al instante como AutoPostula y no como parte del sitio. */
.header {
  background: var(--ink);
  color: #E9EBEA;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 11px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-logo {
  width: 32px; height: 32px;
  background: var(--surface-2);
  border: 1.5px solid var(--border-2);
  border-radius: 9px;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.header-logo svg { width: 18px; height: 18px; display: block; }
.header-logo path {
  fill: none; stroke: var(--marker); stroke-width: 2.6;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 22; stroke-dashoffset: 22;
  animation: tick .5s .25s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes tick { to { stroke-dashoffset: 0; } }

.header-info { flex: 1; min-width: 0; }
.header-title { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
.header-sub {
  font-size: 11px; color: #8E9599;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Pulso: late solo cuando de verdad está trabajando. */
.pulse-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.pulse {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #3C4145;
  transition: background .3s;
}
.pulse.active  { background: #5BD59B; color: #5BD59B; animation: pulse-ring 1.6s ease-out infinite; }
.pulse.working { background: var(--marker); color: var(--marker); animation: pulse-ring .9s ease-out infinite; }
@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 currentColor; }
  70%  { box-shadow: 0 0 0 5px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.pulse-label { font-size: 11px; font-weight: 600; color: #8E9599; }
.pulse-label.active  { color: #5BD59B; }
.pulse-label.working { color: var(--marker); }

/* ── Última puesta al día (docs/rafagas-y-ponerse-al-dia.md §3.5) ────────
   Lo primero que se ve al abrir el popup: si la extensión se puso al día
   mientras la persona hacía otra cosa, tiene que enterarse. */
.rafaga-row {
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.rafaga-titulo { font-size: 12.5px; font-weight: 700; color: var(--text-1); }
.rafaga-detalle { font-size: 11px; color: var(--text-2); margin-top: 1px; }

/* ── "Ponerme al día ahora" (docs/rafagas-y-ponerse-al-dia.md §3.6) ───────
   Solo Premium: en una cuenta gratis la fila ni aparece. Debajo del botón
   va SIEMPRE una línea: cuánto suele tardar, o por qué no se puede ahora. */
.ponerse-row {
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.ponerse-row .btn { width: 100%; }
.ponerse-hint { font-size: 10.5px; color: var(--text-3); margin-top: 6px; line-height: 1.45; }

/* ── Prueba de 5 postulaciones automáticas (docs/rafagas-y-ponerse-al-dia.md §4.1) ──
   Solo cuentas gratis: mientras dura, cuántas lleva; al terminar, qué pasó y
   las dos salidas (Premium, o entrar a mano a un portal). */
.prueba-row {
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.prueba-titulo { font-size: 12px; font-weight: 700; color: var(--text-1); line-height: 1.4; }
.prueba-detalle { font-size: 11px; color: var(--text-2); margin-top: 3px; line-height: 1.45; }
.prueba-links { display: flex; gap: 14px; margin-top: 7px; }
.prueba-links a { font-size: 11.5px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.prueba-links a:hover { text-decoration-thickness: 2px; }

/* ── Stats strip ─────────────────────────────────────────── */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.stat {
  padding: 10px 0;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-n  { font-size: 20px; font-weight: 800; color: var(--text-1); line-height: 1;
           letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-n.accent { color: var(--accent); }
.stat-n.success { color: var(--success); }
.stat { transition: background .15s; }
.stat-label { font-size: 10px; color: var(--text-3); margin-top: 2px; }

/* ── Secciones ───────────────────────────────────────────── */
.section {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.section-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-1);
}
.section-action {
  font-size: 11px; color: var(--accent);
  cursor: pointer; font-weight: 500;
  background: none; border: none;
}
.section-action:hover { text-decoration: underline; }


.input-row { display: flex; gap: 6px; }
.field {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 12px;
  color: var(--text-1);
  background: var(--bg);
  outline: none;
  font-family: inherit;
  transition: border-color .15s;
}
.field:focus { border-color: var(--accent); background: #fff; }
.field::placeholder { color: var(--text-3); }
.field.danger:focus { border-color: var(--danger); }

.btn {
  padding: 6px 12px;
  border-radius: var(--radius);
  border: none;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: background .15s, opacity .15s;
  white-space: nowrap;
}
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); }
.btn-ghost { background: var(--bg); color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--text-3); color: var(--text-1); }
.btn-danger-ghost { background: var(--danger-s); color: var(--danger); border: 1px solid #FECACA; }
.btn-danger-ghost:hover { background: #FEE2E2; }

/* ── Estado con punto de color (perfil / cuenta web) ──────── */
.status-row { display: flex; gap: 6px; align-items: center; }
.status-input-wrap { flex: 1; position: relative; }
.status-input-wrap .field { width: 100%; padding-right: 36px; }
.status-eye {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--text-3); line-height: 1;
}
.status-eye:hover { color: var(--text-1); }
.status-line {
  font-size: 10px; margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}
.status-line .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.status-line .dot.ok  { background: var(--success); }
.status-line .dot.err { background: var(--danger); }

/* ── Footer ───────────────────────────────────────────────── */
.footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; gap: 8px;
  position: sticky; bottom: 0; z-index: 10;
}
.footer .btn-primary { flex: 1; font-size: 13px; padding: 8px; }

/* ── Toast ────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--text-1); color: #fff;
  font-size: 11px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  white-space: nowrap; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Divider helper ──────────────────────────────────────── */
.spacer { height: 6px; background: var(--bg); }
.hidden { display: none !important; }

/* ── Semáforo: en qué está la máquina (docs/estrategia-y-rediseno.md §6) ──
   Lo primero del popup, y lo único que de verdad importa al abrirlo: si está
   postulando, si solo mira o si está en pausa. Antes había que deducirlo de
   tres interruptores que ni siquiera coincidían con lo que decía el panel. */
.estado-row {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 13px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.luz {
  width: 10px; height: 10px; border-radius: 50%;
  margin-top: 4px; flex-shrink: 0;
  background: var(--border-2);
}
.luz.postulando { background: var(--success); box-shadow: 0 0 0 3px var(--success-s); }
.luz.observando { background: var(--warn);    box-shadow: 0 0 0 3px var(--warn-s); }
.luz.pausada    { background: var(--text-3);  box-shadow: 0 0 0 3px var(--accent-s); }
.estado-titulo  { font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; }
.estado-detalle { font-size: 11.5px; color: var(--text-2); margin-top: 2px; line-height: 1.45; }

/* ── Fila que lleva al panel (por decidir, portal sin sesión) ── */
.fila-link {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit; cursor: pointer;
}
.fila-link:hover { background: var(--surface-2); }
.fila-titulo { font-size: 12.5px; font-weight: 700; }
.fila-sub    { font-size: 11px; color: var(--text-2); margin-top: 1px; }
.fila-link .chevron { color: var(--text-3); font-size: 15px; line-height: 1; flex-shrink: 0; }

/* ── Sesión en los portales ── */
.portal-fila {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 0;
  border-top: 1px solid var(--border);
}
.portal-fila:first-child { border-top: none; }
.portal-nombre { font-size: 12px; font-weight: 600; }
.portal-estado { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.portal-estado .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-2); }
.portal-estado.ok .dot   { background: var(--success); }
.portal-estado.ok        { color: var(--success); }
.portal-estado.falta .dot { background: var(--danger); }
.portal-estado a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ── Nota al pie: dónde se cambian las cosas ── */
.nota {
  padding: 9px 16px 12px;
  font-size: 10.5px; color: var(--text-3); line-height: 1.45;
  text-align: center;
}
.nota a { color: var(--text-2); font-weight: 600; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg></div>
  <div class="header-info">
    <div class="header-title">AutoPostula</div>
    <div class="header-sub" id="header-sub">Computrabajo, Laborum y Trabajando</div>
  </div>
  <div class="pulse-wrap">
    <div class="pulse" id="pulse"></div>
    <span class="pulse-label" id="pulse-label">Inactivo</span>
  </div>
</div>

<!-- EN QUÉ ESTÁ: postulando / solo mirando / en pausa -->
<div class="estado-row">
  <span class="luz" id="estado-luz" aria-hidden="true"></span>
  <div>
    <div class="estado-titulo" id="estado-titulo">Cargando…</div>
    <div class="estado-detalle" id="estado-detalle">Consultando tu cuenta.</div>
  </div>
</div>

<!-- ÚLTIMA PUESTA AL DÍA -->
<div class="rafaga-row hidden" id="rafaga-row" role="status">
  <div class="rafaga-titulo" id="rafaga-titulo"></div>
  <div class="rafaga-detalle hidden" id="rafaga-detalle"></div>
</div>

<!-- CIFRAS (de la cuenta, no de este navegador) -->
<div class="stats">
  <div class="stat">
    <div class="stat-n accent" id="stat-enviadas">—</div>
    <div class="stat-label">enviadas hoy</div>
  </div>
  <div class="stat">
    <div class="stat-n" id="stat-descartadas">—</div>
    <div class="stat-label">descartadas</div>
  </div>
  <div class="stat">
    <div class="stat-n success" id="stat-disponibles">—</div>
    <div class="stat-label">disponibles</div>
  </div>
</div>

<!-- POR DECIDIR -->
<a class="fila-link hidden" id="decidir-row" target="_blank" rel="noreferrer">
  <div>
    <div class="fila-titulo" id="decidir-titulo"></div>
    <div class="fila-sub hidden" id="decidir-sub"></div>
  </div>
  <span class="chevron" aria-hidden="true">›</span>
</a>

<!-- PONERME AL DÍA AHORA (solo Premium) -->
<div class="ponerse-row hidden" id="ponerse-row">
  <button class="btn btn-primary" id="ponerse-btn" type="button">Ponerme al día ahora</button>
  <div class="ponerse-hint" id="ponerse-hint"></div>
</div>

<!-- PRUEBA DE 5 POSTULACIONES AUTOMÁTICAS (solo cuentas gratis) -->
<div class="prueba-row hidden" id="prueba-row" role="status">
  <div class="prueba-titulo" id="prueba-titulo"></div>
  <div class="prueba-detalle hidden" id="prueba-detalle"></div>
  <div class="prueba-links hidden" id="prueba-links">
    <a href="#" id="prueba-ver" target="_blank"></a>
    <a href="#" id="prueba-premium" target="_blank"></a>
  </div>
</div>

<!-- SESIÓN EN LOS PORTALES -->
<div class="section hidden" id="portales-sec">
  <div class="section-head">
    <div class="section-title">Sesión en los portales</div>
    <a class="section-action" id="portales-link" target="_blank" rel="noreferrer">Conectar ↗</a>
  </div>
  <div id="portales-lista"></div>
</div>

<!-- CUENTA WEB (solo hace falta si todavía no está conectada) -->
<div class="section" id="cuenta-sec">
  <div class="section-head">
    <div class="section-title">Tu cuenta</div>
  </div>
  <div class="status-line" id="ap-token-status" style="margin-bottom:8px;">
    <div class="dot" id="ap-token-dot"></div>
    <span id="ap-token-status-text">Sin configurar</span>
  </div>
  <button class="section-action" id="ap-token-mostrar-manual" style="padding:0;">¿Problemas para conectar? Pega el token manualmente</button>
  <div id="ap-token-manual" class="hidden" style="margin-top:8px;">
    <div class="status-row">
      <div class="status-input-wrap">
        <input class="field" type="password" id="ap-token" placeholder="Pega tu token aquí">
        <button class="status-eye" id="ap-token-eye" title="Mostrar/ocultar">👁</button>
      </div>
      <button class="btn btn-ghost" id="ap-token-save">Guardar</button>
    </div>
  </div>
</div>

<!-- ACCIONES -->
<div class="footer">
  <button class="btn btn-primary" id="pausar-btn" type="button">Pausar</button>
  <button class="btn btn-ghost" id="scan-now-btn" type="button" title="Escanear la página que tienes abierta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg> Escanear
  </button>
  <button class="btn btn-ghost" id="panel-btn" type="button">Abrir panel</button>
</div>
<div class="nota">
  Tu perfil, lo que buscas y cómo trabaja la extensión se cambian en
  <a href="#" id="nota-link" target="_blank" rel="noreferrer">autopostula.cl</a>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
